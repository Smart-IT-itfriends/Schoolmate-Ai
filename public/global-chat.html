<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchoolMate — Глобальний чат</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --accent: #4f8cff;
      --accent-soft: rgba(79, 140, 255, 0.15);
      --text: #e8eef7;
      --muted: #8b9cb3;
      --danger: #ff6b6b;
      --ok: #3ddc97;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0b1020, #121a28 45%, #0f1419);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .chat-app {
      width: min(720px, 100%);
      height: min(88vh, 820px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .chat-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(0,0,0,0.15);
    }
    .chat-header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .online-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent-soft);
      color: var(--ok);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
    }
    .status-line {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }
    .msg.self {
      align-self: flex-end;
      background: rgba(79, 140, 255, 0.18);
      border-color: rgba(79, 140, 255, 0.35);
    }
    .msg-meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .msg-text { white-space: pre-wrap; word-break: break-word; line-height: 1.45; }
    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: rgba(0,0,0,0.12);
    }
    .composer-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f1724;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }
    textarea:focus { outline: 2px solid rgba(79,140,255,0.35); }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: white;
      min-width: 96px;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .cooldown {
      margin-top: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.2em;
    }
    .cooldown.active { color: #ffb347; }
    .scroll-pause {
      position: absolute;
      bottom: 92px;
      left: 50%;
      transform: translateX(-50%);
      background: #243044;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      display: none;
      cursor: pointer;
      z-index: 2;
    }
    .messages-wrap { position: relative; flex: 1; display: flex; min-height: 0; }
    .error-banner {
      background: rgba(255,107,107,0.12);
      color: #ffc9c9;
      padding: 8px 14px;
      font-size: 0.85rem;
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 560px) {
      .chat-app { height: 92vh; border-radius: 12px; }
      .msg { max-width: 95%; }
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="chat-header">
      <div>
        <h1>🌐 Глобальний чат SchoolMate</h1>
        <div class="status-line" id="connStatus">Підключення...</div>
      </div>
      <div class="online-badge"><span class="online-dot"></span>🟢 Онлайн: <span id="onlineCount">0</span></div>
    </div>
    <div class="error-banner" id="errorBanner"></div>
    <div class="messages-wrap">
      <div class="messages" id="messages"></div>
      <button type="button" class="scroll-pause" id="scrollPauseBtn">⬇️ Нові повідомлення</button>
    </div>
    <div class="composer">
      <div class="composer-row">
        <textarea id="input" maxlength="300" placeholder="Напиши повідомлення або емодзі..." rows="2"></textarea>
        <button type="button" id="sendBtn">Надіслати</button>
      </div>
      <div class="cooldown" id="cooldown"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const userId = params.get('userId') || localStorage.getItem('gchat_userId') || '';
    const token = params.get('token') || localStorage.getItem('gchat_token') || '';

    if (userId) localStorage.setItem('gchat_userId', userId);
    if (token) localStorage.setItem('gchat_token', token);

    const messagesEl = document.getElementById('messages');
    const onlineEl = document.getElementById('onlineCount');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const cooldownEl = document.getElementById('cooldown');
    const connStatus = document.getElementById('connStatus');
    const errorBanner = document.getElementById('errorBanner');
    const scrollPauseBtn = document.getElementById('scrollPauseBtn');

    let slowModeSeconds = 4;
    let maxMessageLength = 250;
    let autoScroll = true;
    let cooldownTimer = null;
    let cooldownLeft = 0;
    let evtSource = null;
    let reconnectDelay = 1000;

    function showError(text) {
      errorBanner.style.display = 'block';
      errorBanner.textContent = text;
      setTimeout(() => { errorBanner.style.display = 'none'; }, 4000);
    }

    function renderMessage(msg, self = false) {
      const div = document.createElement('div');
      div.className = 'msg' + (self ? ' self' : '');
      div.dataset.id = msg.id;
      const time = new Date(msg.createdAt).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
      const klass = msg.userClass ? ` · ${msg.userClass} клас` : '';
      div.innerHTML = `<div class="msg-meta"><b>${escapeHtml(msg.userName)}</b>${klass} · ${time}</div><div class="msg-text">${escapeHtml(msg.text)}</div>`;
      messagesEl.appendChild(div);
      if (autoScroll) messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(text) {
      return String(text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function removeMessage(id) {
      const node = messagesEl.querySelector(`[data-id="${id}"]`);
      if (node) node.remove();
    }

    function startCooldown(seconds) {
      cooldownLeft = Math.max(0, Number(seconds) || slowModeSeconds);
      updateCooldownUi();
      clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        cooldownLeft -= 1;
        updateCooldownUi();
        if (cooldownLeft <= 0) clearInterval(cooldownTimer);
      }, 1000);
    }

    function updateCooldownUi() {
      if (cooldownLeft > 0) {
        cooldownEl.classList.add('active');
        cooldownEl.textContent = `⏳ Slowmode: зачекай ${cooldownLeft} с перед наступним повідомленням`;
        sendBtn.disabled = true;
      } else {
        cooldownEl.classList.remove('active');
        cooldownEl.textContent = `Slowmode: ${slowModeSeconds} с між повідомленнями · max ${maxMessageLength} символів`;
        sendBtn.disabled = false;
      }
    }

    async function loadHistory() {
      const res = await fetch('/global-chat/api/history');
      const data = await res.json();
      slowModeSeconds = data.slowModeSeconds || 4;
      maxMessageLength = data.maxMessageLength || 250;
      inputEl.maxLength = maxMessageLength;
      onlineEl.textContent = data.online || 0;
      messagesEl.innerHTML = '';
      (data.messages || []).forEach((m) => renderMessage(m, String(m.userId) === String(userId)));
      updateCooldownUi();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      if (!userId || !token) {
        showError('Потрібен userId і token. Відкрий чат через Telegram-бота.');
        return;
      }
      sendBtn.disabled = true;
      try {
        const res = await fetch('/global-chat/api/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId, token, text }),
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.message || data.error || 'Помилка відправки');
          if (data.retryAfterSec) startCooldown(data.retryAfterSec);
          else sendBtn.disabled = cooldownLeft > 0;
          return;
        }
        inputEl.value = '';
        renderMessage(data.message, true);
        startCooldown(slowModeSeconds);
      } catch (err) {
        showError('Немає з\'єднання з сервером');
        sendBtn.disabled = cooldownLeft > 0;
      }
    }

    function connectSse() {
      if (evtSource) evtSource.close();
      evtSource = new EventSource('/global-chat/api/events');
      connStatus.textContent = 'Підключено (SSE)';

      evtSource.addEventListener('online', (e) => {
        const data = JSON.parse(e.data);
        onlineEl.textContent = data.count;
      });

      evtSource.addEventListener('message', (e) => {
        const data = JSON.parse(e.data);
        if (!messagesEl.querySelector(`[data-id="${data.id}"]`)) {
          renderMessage(data, String(data.userId) === String(userId));
        }
      });

      evtSource.addEventListener('delete', (e) => {
        const data = JSON.parse(e.data);
        removeMessage(data.id);
      });

      evtSource.addEventListener('history', (e) => {
        const data = JSON.parse(e.data);
        messagesEl.innerHTML = '';
        (data.messages || []).forEach((m) => renderMessage(m, String(m.userId) === String(userId)));
      });

      evtSource.addEventListener('heartbeat', () => {
        connStatus.textContent = 'Онлайн · ' + new Date().toLocaleTimeString('uk-UA');
      });

      evtSource.onerror = () => {
        connStatus.textContent = 'Перепідключення...';
        evtSource.close();
        setTimeout(() => {
          reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
          connectSse();
        }, reconnectDelay);
      };

      evtSource.onopen = () => {
        reconnectDelay = 1000;
      };
    }

    messagesEl.addEventListener('scroll', () => {
      const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
      autoScroll = nearBottom;
      scrollPauseBtn.style.display = autoScroll ? 'none' : 'block';
    });

    scrollPauseBtn.addEventListener('click', () => {
      autoScroll = true;
      scrollPauseBtn.style.display = 'none';
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    loadHistory().then(connectSse).catch(() => showError('Не вдалося завантажити історію'));
  </script>
</body>
</html>
